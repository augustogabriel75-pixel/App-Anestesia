name: Web (site)

# Publica a versão web/PWA:
#  - na sua VPS (domínio próprio), se os secrets VPS_* existirem;
#  - no GitHub Pages, se estiver ativado (Settings → Pages → Source: "GitHub Actions").
#  - Roda logo depois do workflow "Android APK" terminar com sucesso, para que o
#    versao.json só anuncie uma versão cujo APK já está disponível para download.
on:
  workflow_run:
    workflows: ['Android APK']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  web:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      VA_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VA_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      VA_CHECKOUT_SITE_URL: ${{ vars.CHECKOUT_SITE_URL }}
      VA_PIX_CHAVE: ${{ vars.PIX_CHAVE }}
      VA_PIX_NOME: ${{ vars.PIX_NOME }}
      VA_PIX_CIDADE: ${{ vars.PIX_CIDADE }}
      VA_PAGAMENTO: ${{ vars.PAGAMENTO }}
      VA_SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
      HAS_VPS: ${{ secrets.VPS_HOST != '' }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      VA_VERSAO_MINIMA: ${{ vars.VERSAO_MINIMA }}
      VA_NOVIDADES: ${{ vars.NOVIDADES }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Número da versão e link do APK
        run: |
          BUILD=$((100 + $(git rev-list --count HEAD)))
          echo "VA_APP_BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "VA_APP_VERSION=1.2.$BUILD" >> "$GITHUB_ENV"
          if [ -n "${{ vars.APK_URL }}" ]; then URL="${{ vars.APK_URL }}"
          elif [ "$HAS_VPS" = "true" ]; then URL="${VA_SITE_URL%/}/download/VetAnest.apk"
          elif [ "$HAS_KEYSTORE" = "true" ]; then URL="https://github.com/${{ github.repository }}/releases/latest/download/VetAnest-release.apk"
          else URL="https://github.com/${{ github.repository }}/releases/latest/download/VetAnest.apk"; fi
          echo "VA_APK_URL=$URL" >> "$GITHUB_ENV"
          echo "Versão 1.2.$BUILD – APK: $URL – mínima: ${VA_VERSAO_MINIMA:-0}"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:www

      # Sua VPS (domínio próprio). Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (+ VPS_PORT, VPS_KNOWN_HOSTS opcionais)
      - name: Publicar na VPS
        if: env.HAS_VPS == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash deploy/publicar.sh site www

      - name: Verificar se o GitHub Pages está ativado
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Aviso
        if: steps.pages.outcome != 'success' && env.HAS_VPS != 'true'
        run: |
          echo "::warning::GitHub Pages não está ativado. Ative em Settings → Pages → Source = GitHub Actions e rode este workflow de novo."

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: www

      - name: Publicar
        id: deploy
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
