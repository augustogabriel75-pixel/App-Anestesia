name: Android APK

on:
  push:
    paths-ignore: ['README.md', 'supabase/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Configure em Settings → Secrets and variables → Actions → Variables.
      # Sem elas, o app é gerado em MODO DEMONSTRAÇÃO (sem servidor).
      VA_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VA_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      VA_CHECKOUT_SITE_URL: ${{ vars.CHECKOUT_SITE_URL }}
      VA_PIX_CHAVE: ${{ vars.PIX_CHAVE }}
      VA_PIX_NOME: ${{ vars.PIX_NOME }}
      VA_PIX_CIDADE: ${{ vars.PIX_CIDADE }}
      VA_PAGAMENTO: ${{ vars.PAGAMENTO }}
      VA_SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_VPS: ${{ secrets.VPS_HOST != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm ci

      - name: Gerar www/ (offline, sem CDN)
        run: npm run build:www

      - name: Criar projeto Android
        run: npx cap add android

      - name: Ícones do app
        run: npx capacitor-assets generate --android --assetPath resources

      - name: Versão do app
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK de teste (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/VetAnest.apk"

      # Build de produção assinado (Play Store) – só roda se os secrets existirem:
      # ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Compilar release assinado (AAB + APK)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_ALIAS_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          npx cap build android --keystorepath "$RUNNER_TEMP/release.keystore" --keystorepass "$KS_PASS" --keystorealias "$KS_ALIAS" --keystorealiaspass "$KS_ALIAS_PASS" --androidreleasetype AAB
          npx cap build android --keystorepath "$RUNNER_TEMP/release.keystore" --keystorepass "$KS_PASS" --keystorealias "$KS_ALIAS" --keystorealiaspass "$KS_ALIAS_PASS" --androidreleasetype APK --signing-type apksigner
          find android/app/build/outputs -name "*release*.aab" -exec cp {} "$GITHUB_WORKSPACE/VetAnest-release.aab" \;
          find android/app/build/outputs -name "*release*.apk" -exec cp {} "$GITHUB_WORKSPACE/VetAnest-release.apk" \;
          rm -f "$RUNNER_TEMP/release.keystore"
          ls -la "$GITHUB_WORKSPACE"/VetAnest*

      - name: Publicar APK na VPS (https://SEU_DOMINIO/download/VetAnest.apk)
        if: env.HAS_VPS == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -f VetAnest-release.apk ]; then APK=VetAnest-release.apk; else APK=VetAnest.apk; echo "::warning::Sem keystore: publicando APK de teste (debug). Clientes precisarão reinstalar a cada versão – veja deploy/gerar-keystore.sh"; fi
          bash deploy/publicar.sh apk "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: VetAnest-android
          path: VetAnest*.a*

      - name: Publicar como Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.1.${{ github.run_number }}
          name: VetAnest v1.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: VetAnest*.a*
          body: |
            VetAnest Monitor – build ${{ github.run_number }} (commit ${{ github.sha }}, branch ${{ github.ref_name }}).
            Modo: ${{ env.VA_SUPABASE_URL != '' && 'nuvem (Supabase)' || 'demonstração (sem servidor)' }}.

            • **VetAnest.apk** – instale no celular Android para testar (permita "instalar apps desconhecidos").
            • **VetAnest-release.aab** – pacote assinado para a Play Store (presente quando a keystore está configurada).
