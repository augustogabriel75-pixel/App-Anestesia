# VetAnest – configuração do nginx (o setup-vps.sh troca SEU_DOMINIO e ajusta o HTTPS via certbot)
server {
    listen 80;
    listen [::]:80;
    server_name SEU_DOMINIO;

    root /var/www/vetanest;
    index index.html;
    charset utf-8;

    # Segurança básica
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # App (SPA): sempre a versão mais nova do HTML, do service worker e dos scripts.
    # (cache via "expires" para não anular os cabeçalhos de segurança acima)
    location = /index.html { expires -1; }
    location = /sw.js      { expires -1; }
    location = /manifest.webmanifest { default_type application/manifest+json; expires -1; }
    location /js/     { expires -1; }
    location /vendor/ { expires 7d; }
    location /icons/  { expires 7d; }

    # Versão publicada: lida pelo app Android (outra origem), por isso o CORS
    location = /versao.json {
        expires -1;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Download do app Android
    location /download/ {
        types { application/vnd.android.package-archive apk; }
        expires -1;
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location / { try_files $uri $uri/ /index.html; }

    # Nada de arquivos ocultos (.git, .env…)
    location ~ /\. { deny all; }
}
